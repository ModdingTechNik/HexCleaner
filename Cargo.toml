[package]
name = "HexCleaner"
version = "0.1.0"
edition = "2024"
description = "Очистка мусорных файлов и кэшей Windows"

# Ядро очистки — библиотека, общая для двух программ:
# окна (HexCleaner.exe) и командной строки (HexCleanerCli.exe).
[lib]
name = "hexcleaner"
path = "src/lib.rs"

[[bin]]
name = "HexCleaner"
path = "src/main.rs"

[[bin]]
name = "HexCleanerCli"
path = "src/bin/cli.rs"

[dependencies]
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
glob = "0.3"
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_RestartManager",
    "Win32_System_EventLog",
    "Win32_System_Services",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = true
strip = true
